name: Godot Foundation QA

on:
  push:
    branches:
      - migration/godot-4
      - migration/godot-stage-2-resources
      - migration/godot-stage-3-settlement
      - migration/godot-stage-4-combat
      - migration/godot-stage-5-mobile-ui
      - migration/godot-stage-6-progression-save
      - migration/godot-stage-7-units-wildlife
      - migration/godot-stage-8-fortifications
      - migration/godot-stage-9-meta-progression
    paths:
      - 'godot/**'
      - '.github/workflows/godot-foundation.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-foundation.yml'

permissions:
  contents: write

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply confirmed Stage 9 Godot 4.3 typing fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('godot/scripts/meta_progression_manager.gd')
          text = path.read_text()
          replacements = {
              'var resource := ["wood", "stone", "food"][_rng.randi_range(0, 2)]': 'var resource: String = str(["wood", "stone", "food"][_rng.randi_range(0, 2)])',
              'var resource := ["wood", "stone", "gold"][_rng.randi_range(0, 2)]': 'var resource: String = str(["wood", "stone", "gold"][_rng.randi_range(0, 2)])',
              'var resource := ["wood", "stone", "food", "gold"][_rng.randi_range(0, 3)]': 'var resource: String = str(["wood", "stone", "food", "gold"][_rng.randi_range(0, 3)])',
          }
          changed = 0
          for old, new in replacements.items():
              count = text.count(old)
              if count not in (0, 1):
                  raise SystemExit(f'unexpected replacement count {count}: {old}')
              if count == 1:
                  text = text.replace(old, new)
                  changed += 1
          path.write_text(text)
          print(f'Applied {changed} Stage 9 typing replacements')
          PY
          if ! git diff --quiet -- godot/scripts/meta_progression_manager.gd; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add godot/scripts/meta_progression_manager.gd
            git commit -m "Fix Stage 9 Godot 4.3 reward typing"
            git push origin HEAD:migration/godot-stage-9-meta-progression
          fi
      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Verify Godot
        run: godot --version
      - name: Import and parse project
        run: godot --headless --path godot --editor --quit
      - name: Stage 2 resource tests
        run: godot --headless --path godot --script res://tests/stage2_resources.gd
      - name: Stage 3 settlement tests
        run: godot --headless --path godot --script res://tests/stage3_settlement.gd
      - name: Stage 4 combat tests
        run: godot --headless --path godot --script res://tests/stage4_combat.gd
      - name: Stage 5 mobile UI tests
        run: godot --headless --path godot --script res://tests/stage5_mobile_ui.gd
      - name: Stage 6 progression and save tests
        run: godot --headless --path godot --script res://tests/stage6_progression_save.gd
      - name: Stage 7 unit and wildlife tests
        run: godot --headless --path godot --script res://tests/stage7_units_wildlife.gd
      - name: Stage 8 fortification tests
        run: godot --headless --path godot --script res://tests/stage8_fortifications.gd
      - name: Stage 9 meta progression tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/stage9_meta_progression.gd 2>&1 | tee stage9-test.log
      - name: Upload Stage 9 diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-test-log
          path: stage9-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Boot main scene
        run: godot --headless --path godot --quit-after 8
      - name: Export Web build
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --export-release "Web" build/web/index.html
          test -f godot/build/web/index.html
          test -f godot/build/web/index.wasm
          test -f godot/build/web/index.pck
      - name: Upload Web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-camp-game-godot-web
          path: godot/build/web
          if-no-files-found: error
          retention-days: 7
