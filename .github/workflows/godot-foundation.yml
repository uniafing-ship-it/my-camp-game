name: Godot Foundation QA

on:
  push:
    branches:
      - migration/godot-4
    paths:
      - 'godot/**'
      - '.github/workflows/godot-foundation.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-foundation.yml'

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import and parse project
        run: godot --headless --path godot --editor --quit

      - name: Boot main scene
        run: godot --headless --path godot --quit-after 8
