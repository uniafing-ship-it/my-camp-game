name: Wire V20 Runtime

on:
  push:
    branches: [main]
    paths:
      - index.html
      - js/**
      - .github/workflows/wire-v20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, '[v20-wired]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add modular runtime entrypoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script type="module" src="./js/main.js"></script>'
          if tag in s:
              raise SystemExit(0)
          marker = '</body>'
          if marker not in s:
              raise SystemExit('body marker not found')
          p.write_text(s.replace(marker, tag + '\n' + marker, 1), encoding='utf-8')
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: wire V20 runtime [v20-wired]'
          git push
